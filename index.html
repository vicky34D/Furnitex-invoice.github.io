<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furnitex Mukundapur - Quotation Generator</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- jsPDF-AutoTable plugin for creating tables in PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom styles for table inputs to make them blend in */
        .table-input, .table-select {
            border: none;
            background-color: transparent;
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .table-input:focus, .table-select:focus {
            outline: none;
            background-color: #e0f2fe; /* Light blue on focus */
        }
        tr:hover .table-input, tr:hover .table-select {
             background-color: #f1f5f9; /* Light gray on row hover */
        }
        /* Style for the delete button */
        .delete-btn {
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }
        tr:hover .delete-btn {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">
    <div class="container mx-auto p-4 md:p-8">
        
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-slate-900">Furnitex Mukundapur</h1>
            <p class="text-lg text-slate-600">Quotation Generator</p>
        </header>

        <!-- Main Content -->
        <main class="bg-white rounded-lg shadow-lg p-6">
            <div class="overflow-x-auto">
                <!-- Quotation Table -->
                <table class="w-full text-sm text-left" id="quotation-table">
                    <thead class="bg-slate-200 text-slate-600 uppercase">
                        <tr>
                            <th class="p-3 w-12 text-center">S. No.</th>
                            <th class="p-3">Particulars</th>
                            <th class="p-3">Measurement Details / Total Sqft</th>
                            <th class="p-3">Per Sqft Rate</th>
                            <th class="p-3">Price Offered by FURNITEX</th>
                            <th class="p-3">FURNITEX’S Remarks</th>
                            <th class="p-3">Remarks</th>
                            <th class="p-3 w-12"></th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Rows will be added dynamically here -->
                    </tbody>
                </table>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center justify-between mt-6">
                <button id="add-row-btn" class="bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-blue-700 transition">
                    + Add Item
                </button>
                <div class="text-right">
                    <div class="text-lg font-bold">Total: <span id="total-price" class="text-blue-700">₹0.00</span></div>
                </div>
            </div>

             <!-- Customer Details and Download -->
            <div class="mt-8 border-t pt-6 flex flex-col md:flex-row justify-between items-center gap-4">
                 <div>
                    <h3 class="text-lg font-semibold mb-2">Customer Details</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <input id="customer-name" type="text" placeholder="Customer Name" class="border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <input id="customer-address" type="text" placeholder="Address" class="border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
                <button id="download-pdf-btn" class="w-full md:w-auto mt-4 md:mt-0 bg-green-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:bg-green-700 transition flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                    Download Invoice (PDF)
                </button>
            </div>
        </main>

        <!-- Footer -->
        <footer class="text-center text-slate-500 mt-8 text-sm">
            <p>&copy; <span id="current-year"></span> Furnitex Mukundapur. All rights reserved.</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.getElementById('table-body');
            const addRowBtn = document.getElementById('add-row-btn');
            const downloadPdfBtn = document.getElementById('download-pdf-btn');
            const totalPriceEl = document.getElementById('total-price');
            
            document.getElementById('current-year').textContent = new Date().getFullYear();

            const particularsOptions = [
                "Upper Kitchen", "Lower Kitchen", "Wardrobe", "Almirah", "Bed", 
                "Chair", "Dining table", "Tv Unit", "Repairing", "Wood Polish", "Custom..."
            ];
            const rateOptions = [1000, 1100, 1200, 1300, 1400, "Custom..."];
            const remarksOptions = ["Deviation", "no deviation", "upgraded", "Custom..."];

            // --- Core Functions ---

            // Helper to create HTML string for a select element
            const createSelectHTML = (options, values = options) => {
                let optionsHTML = '';
                options.forEach((option, index) => {
                    const value = values[index];
                    optionsHTML += `<option value="${value}">${option}</option>`;
                });
                return `<select class="table-select">${optionsHTML}</select>`;
            };

            // Function to add a new row to the table
            const addRow = () => {
                const rowCount = tableBody.rows.length;
                const newRow = tableBody.insertRow(rowCount);
                newRow.className = 'border-b border-slate-200 hover:bg-slate-50';

                newRow.insertCell(0).innerHTML = `<div class="p-3 text-center font-medium text-slate-500">${rowCount + 1}</div>`;
                
                newRow.insertCell(1).innerHTML = `<div class="custom-container">${createSelectHTML(particularsOptions)}</div>`;

                // MODIFIED: Input for measurement expression with a result display area
                newRow.insertCell(2).innerHTML = `
                    <div class="flex items-center gap-2">
                        <input type="text" class="table-input measurement-expression flex-grow" placeholder="e.g., 7*7" data-calculated-value="0">
                        <span class="measurement-result text-slate-600 font-medium whitespace-nowrap"></span>
                    </div>
                `;

                newRow.insertCell(3).innerHTML = `<div class="custom-container">${createSelectHTML(rateOptions.map(r => r === 'Custom...' ? r : `Rs. ${r}`), rateOptions)}</div>`;

                newRow.insertCell(4).innerHTML = `<input type="number" class="table-input price-input" placeholder="Auto" min="0" step="0.01">`;

                newRow.insertCell(5).innerHTML = `<div class="custom-container">${createSelectHTML(remarksOptions)}</div>`;

                newRow.insertCell(6).innerHTML = `<input type="text" class="table-input" placeholder="Add custom notes...">`;
                
                newRow.insertCell(7).innerHTML = `<div class="p-3 text-center"><span class="delete-btn text-red-500 hover:text-red-700" title="Delete Row">&times;</span></div>`;
            };
            
            // Helper to evaluate measurement expressions safely
            const evaluateExpression = (expression) => {
                if (!expression || typeof expression !== 'string') return 0;

                // If it's just a number, return it directly.
                if (!isNaN(parseFloat(expression)) && isFinite(expression)) {
                    return parseFloat(expression);
                }

                // Clean the expression: allow numbers, decimals, and operators *, x, X
                const cleaned = expression.replace(/[^0-9.*xX]/g, '');
                const operator = cleaned.includes('*') ? '*' : (cleaned.toLowerCase().includes('x') ? 'x' : null);

                if (!operator) return 0;

                const parts = cleaned.split(operator);
                if (parts.length !== 2) return 0;

                const num1 = parseFloat(parts[0]);
                const num2 = parseFloat(parts[1]);

                if (isNaN(num1) || isNaN(num2)) return 0;
                
                return num1 * num2;
            };

            const createSelect = (options, values = options) => {
                const select = document.createElement('select');
                select.className = 'table-select';
                options.forEach((option, index) => {
                    const opt = document.createElement('option');
                    opt.value = values[index];
                    opt.textContent = option;
                    select.appendChild(opt);
                });
                return select;
            };

            const updateSerialNumbers = () => {
                const rows = tableBody.rows;
                for (let i = 0; i < rows.length; i++) {
                    rows[i].cells[0].firstElementChild.textContent = i + 1;
                }
            };
            
            const updateTotals = () => {
                let total = 0;
                const rows = tableBody.rows;
                const serviceItems = ["Repairing", "Wood Polish"]; // Items that don't use "Sqft"

                for (const row of rows) {
                    const measurementInput = row.querySelector('.measurement-expression');
                    const resultSpan = row.querySelector('.measurement-result');
                    const priceInput = row.querySelector('.price-input');
                    
                    const particularCell = row.cells[1];
                    const customParticularInput = particularCell.querySelector('.custom-input');
                    const particularValue = customParticularInput ? customParticularInput.value : particularCell.querySelector('select').value;


                    const expression = measurementInput.value;
                    const calculatedValue = evaluateExpression(expression);
                    
                    // Store the calculated value for PDF generation
                    measurementInput.dataset.calculatedValue = calculatedValue;

                    // Display the calculated result differently for services vs. products
                    if (calculatedValue > 0) {
                        if (serviceItems.includes(particularValue)) {
                            // For services, treat it as quantity, not sqft
                             resultSpan.textContent = `(Qty: ${calculatedValue.toFixed(2)})`;
                        } else {
                            resultSpan.textContent = `= ${calculatedValue.toFixed(2)} Sqft`;
                        }
                    } else {
                        resultSpan.textContent = '';
                    }

                    const rateCell = row.cells[3];
                    let rate = 0;
                    const customRateInput = rateCell.querySelector('.custom-input');
                    if (customRateInput) {
                        rate = parseFloat(customRateInput.value) || 0;
                    } else {
                        rate = parseFloat(rateCell.querySelector('select')?.value) || 0;
                    }
                    
                    // Handle price calculation vs. custom override
                    if (priceInput.dataset.customPrice !== 'true') {
                        const price = calculatedValue * rate;
                        // Use .value for input fields
                        priceInput.value = price > 0 ? price.toFixed(2) : '';
                        priceInput.placeholder = "Auto"; // Reset placeholder
                    }
                    
                    // Add the final value (custom or calculated) to the grand total
                    total += parseFloat(priceInput.value) || 0;
                }
                totalPriceEl.textContent = `Rs. ${total.toFixed(2)}`;
            };
            
            const generatePDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                const customerName = document.getElementById('customer-name').value.trim();
                const customerAddress = document.getElementById('customer-address').value.trim();

                doc.setFontSize(22);
                doc.setFont("helvetica", "bold");
                doc.text("Furnitex Mukundapur", 105, 20, { align: 'center' });

                doc.setFontSize(16);
                doc.setFont("helvetica", "normal");
                doc.text("Quotation / Invoice", 105, 30, { align: 'center' });
                
                doc.setLineWidth(0.5);
                doc.line(20, 35, 190, 35);

                const startY = 45;
                doc.setFontSize(11);
                doc.setFont("helvetica", "bold");
                doc.text("Bill To:", 20, startY);
                doc.setFont("helvetica", "normal");
                doc.text(customerName || "N/A", 20, startY + 5);
                doc.text(customerAddress || "N/A", 20, startY + 10);
                
                doc.setFont("helvetica", "bold");
                doc.text("Date:", 140, startY);
                doc.setFont("helvetica", "normal");
                doc.text(new Date().toLocaleDateString('en-IN'), 155, startY);

                const tableData = [];
                const headers = ["S. No.", "Particulars", "Measurement Details", "Rate", "Price", "FURNITEX Remarks", "Remarks"];
                
                const rows = tableBody.rows;
                for (const row of rows) {
                    const measurementInput = row.querySelector('.measurement-expression');

                    const particularCell = row.cells[1];
                    const customParticularInput = particularCell.querySelector('.custom-input');
                    let particularValue = customParticularInput ? customParticularInput.value : particularCell.querySelector('select').value;
                    if (particularValue === 'Custom...') particularValue = customParticularInput?.value || 'N/A';
                    
                    const serviceItems = ["Repairing", "Wood Polish"];
                    const expression = measurementInput.value.trim();
                    const result = parseFloat(measurementInput.dataset.calculatedValue || 0).toFixed(2);
                    
                    let measurementDisplay = 'N/A';
                    if (parseFloat(result) > 0) {
                        if (serviceItems.includes(particularValue)) {
                             measurementDisplay = `Qty: ${result}`;
                        } else if (expression.includes('*') || expression.toLowerCase().includes('x')) {
                            measurementDisplay = `${expression} = ${result} Sqft`;
                        } else {
                            measurementDisplay = `${result} Sqft`;
                        }
                    }

                    const rateCell = row.cells[3];
                    const customRateInput = rateCell.querySelector('.custom-input');
                    let rateValue = customRateInput ? customRateInput.value : rateCell.querySelector('select').value;
                    if (rateValue === 'Custom...') rateValue = customRateInput?.value || 0;
                    
                    const furnitexRemarksCell = row.cells[5];
                    const customFurnitexRemarkInput = furnitexRemarksCell.querySelector('.custom-input');
                    let furnitexRemarkValue = customFurnitexRemarkInput ? customFurnitexRemarkInput.value : furnitexRemarksCell.querySelector('select').value;
                    if (furnitexRemarkValue === 'Custom...') furnitexRemarkValue = customFurnitexRemarkInput?.value || 'N/A';

                    const rowData = [
                        row.cells[0].textContent.trim(),
                        particularValue,
                        measurementDisplay,
                        `Rs. ${parseFloat(rateValue).toFixed(2)}`,
                        `Rs. ${parseFloat(row.querySelector('.price-input').value || 0).toFixed(2)}`,
                        furnitexRemarkValue,
                        row.cells[6].querySelector('input').value,
                    ];
                    tableData.push(rowData);
                }

                doc.autoTable({
                    head: [headers],
                    body: tableData,
                    startY: startY + 20,
                    theme: 'grid',
                    headStyles: { fillColor: [75, 85, 99] },
                    styles: { fontSize: 9, cellPadding: 2 },
                });
                
                const finalY = doc.autoTable.previous.finalY;
                doc.setFontSize(12);
                doc.setFont("helvetica", "bold");
                doc.text("Grand Total:", 140, finalY + 15);
                doc.setFont("helvetica", "bold");
                doc.text(totalPriceEl.textContent, 190, finalY + 15, { align: 'right' });
                
                doc.save(`Quotation-Furnitex-${customerName || 'Invoice'}.pdf`);
            };

            // --- Event Listeners ---
            addRowBtn.addEventListener('click', addRow);
            
            downloadPdfBtn.addEventListener('click', () => {
                if (tableBody.rows.length === 0) {
                    alert('Please add at least one item to the quotation before downloading.');
                    return;
                }
                generatePDF();
            });

            tableBody.addEventListener('change', (e) => {
                if (e.target.tagName === 'SELECT') {
                    const select = e.target;
                    const container = select.parentElement;
                    const existingCustomInput = container.querySelector('.custom-input');

                    if (select.value.toString().toLowerCase().includes('custom')) {
                        if (!existingCustomInput) {
                            const isRateColumn = select.closest('td').cellIndex === 3;
                            const inputType = isRateColumn ? 'number' : 'text';
                            const placeholder = isRateColumn ? 'Enter Rate' : 'Enter Custom Value';
                            
                            const customInput = document.createElement('input');
                            customInput.type = inputType;
                            if(inputType === 'number') {
                                customInput.min = "0";
                                customInput.step = "0.01";
                            }
                            customInput.className = 'table-input custom-input mt-1';
                            customInput.placeholder = placeholder;
                            container.appendChild(customInput);
                            customInput.focus();
                        }
                    } else {
                        if (existingCustomInput) {
                            existingCustomInput.remove();
                        }
                    }

                    // When a select changes, potentially unlock price for auto-calc
                    const row = e.target.closest('tr');
                    row.querySelector('.price-input').dataset.customPrice = 'false';
                    updateTotals();
                }
            });

            tableBody.addEventListener('keyup', (e) => {
                 if (e.target.classList.contains('measurement-expression') || (e.target.classList.contains('custom-input') && e.target.type === 'number')) {
                    // When measurement or custom rate changes, unlock price for auto-calculation
                    const row = e.target.closest('tr');
                    row.querySelector('.price-input').dataset.customPrice = 'false';
                    updateTotals();
                }
            });

            // Add event listener for custom price input
            tableBody.addEventListener('input', (e) => {
                if(e.target.classList.contains('price-input')) {
                    if (e.target.value) {
                        e.target.dataset.customPrice = 'true';
                        e.target.placeholder = "Custom"; // Indicate custom price
                    } else {
                        e.target.dataset.customPrice = 'false';
                    }
                    // We only need to update the grand total, not the whole table
                    updateTotals();
                }
            });

            tableBody.addEventListener('click', (e) => {
                if (e.target.classList.contains('delete-btn')) {
                    const row = e.target.closest('tr');
                    row.remove();
                    updateSerialNumbers();
                    updateTotals();
                }
            });

            // --- Initial State ---
            addRow();
        });
    </script>
</body>
</html>
